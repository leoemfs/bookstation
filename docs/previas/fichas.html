<title>BookStation Fichas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: moldura de celular centralizada; barra fixa no topo, cartões no meio, barra de 5 ações com + no centro */
:root{
  color-scheme:dark;
  --bg:#08080a; --surface:#121214; --raised:#1c1c1f; --border:#2a2a2f;
  --text:#f4f2ee; --muted:#a3a0a8; --faint:#6e6b73;
  --accent:#e0a84a; --accent-soft:rgb(224 168 74 / .14); --on-accent:#1a1204;
  --green:#4ade80; --blue:#60a5fa; --violet:#c4a5fd; --red:#f87171;
  --paper-white:#fbfaf7; --paper-old:#efe3c4; --ink:#22201c;
  --f-ui:"Inter",system-ui,sans-serif; --f-book:"Literata",Georgia,serif; --f-hand:"Caveat","Segoe Print",cursive;
}
body{background:#000;color:var(--text);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.note{max-width:420px;color:var(--muted);font-size:13px;line-height:1.5;text-align:center}
.note b{color:var(--text)}
.phone{width:100%;max-width:400px;height:780px;max-height:calc(100vh - 110px);min-height:560px;background:var(--bg);border:1px solid var(--border);border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.top{position:absolute;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:6px;padding:14px 12px 12px;background:rgb(8 8 10 / .92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .t{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{color:var(--muted)} .top .t b{font-weight:600}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:none;border:0;color:var(--text);cursor:pointer}
.ib:hover{background:var(--raised)} .ib.back{color:var(--accent)} .ib[hidden]{display:none}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow-y:auto;padding:76px 14px 110px}
.h{font-family:var(--f-book);font-size:24px;font-weight:600;margin:4px 2px 12px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:-6px 2px 14px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:20px 2px 10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--raised);color:var(--muted);font-size:13px;border:1px solid transparent;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:rgb(224 168 74 / .35)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#3a3a40}
.stack{display:flex;flex-direction:column;gap:10px}
.book{display:flex;gap:14px}
.cover{flex:none;width:70px;height:100px;border-radius:6px 10px 10px 6px;display:flex;align-items:flex-end;padding:8px;font-family:var(--f-book);font-size:11px;line-height:1.15;color:#fff;box-shadow:inset 6px 0 0 rgb(0 0 0 / .25)}
.book .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.book h3{margin:0;font-family:var(--f-book);font-size:17px;font-weight:600}
.meta{color:var(--muted);font-size:12.5px;line-height:1.45}
.pill{align-self:flex-start;font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:500}
.p-esc{background:rgb(74 222 128 / .13);color:var(--green)} .p-plan{background:rgb(96 165 250 / .14);color:var(--blue)} .p-rev{background:rgb(196 165 253 / .15);color:var(--violet)} .p-dev{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;min-height:86px}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:19px;height:19px}
.tile b{font-size:14px;font-weight:600} .tile small{color:var(--muted);font-size:12px}
.hero{background:linear-gradient(160deg,#2a1f0e,#141216 70%);border-color:#3b2e17}
.hero .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h3{font-family:var(--f-book);margin:6px 0 4px;font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums} .stat small{font-size:11px;color:var(--muted)}
.chap{display:flex;gap:12px;align-items:center}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--raised);display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.chap .info{flex:1;min-width:0} .chap h4{margin:0 0 2px;font-size:15px;font-weight:600}
.drag{color:var(--faint)}
.person{display:flex;gap:12px;align-items:center}
.av{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-book);font-size:20px;color:#fff}
.person h4{margin:0;font-size:15px} .refs{font-size:12px;color:var(--accent);margin-top:3px}
/* barra de baixo */
.bar{position:absolute;inset:auto 10px 12px;z-index:8;height:64px;border-radius:22px;background:rgb(28 28 31 / .95);backdrop-filter:blur(10px);border:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.bar button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:var(--f-ui);cursor:pointer;padding:6px 0}
.bar button.on{color:var(--accent)}
.bar .plus{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);margin-top:-22px;box-shadow:0 6px 18px rgb(224 168 74 / .35);display:grid;place-items:center;padding:0}
.bar .plus svg{width:26px;height:26px;stroke-width:2.4;transition:transform .2s}
.bar .plus.open svg{transform:rotate(45deg)}
/* folha do + */
.shade{position:absolute;inset:0;z-index:6;background:rgb(0 0 0 / .55)}
.sheet{position:absolute;inset:auto 0 0;z-index:7;background:var(--raised);border-radius:24px 24px 0 0;padding:10px 14px 96px;border-top:1px solid var(--border)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 12px}
.sheet h5{margin:0 4px 10px;font-size:13px;color:var(--muted);font-weight:500}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-size:12px;font-family:var(--f-ui);cursor:pointer;text-align:center}
.act .ic{color:var(--accent)}
.sep{grid-column:1/-1;border-top:1px solid var(--border);margin:4px 0}
/* editor */
.tools{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:2}
.trow{display:flex;align-items:center;gap:4px}
.sel{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:13.5px;color:var(--text);display:flex;justify-content:space-between}
.tb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:none;border:0;color:var(--text);font-weight:700;font-size:16px;cursor:pointer;font-family:var(--f-ui)}
.tb.hl{background:#6b5517;color:#fff} .tb.more{width:auto;padding:0 8px;color:var(--muted);font-weight:500;font-size:13px;margin-left:auto}
.paper{margin-top:10px;border-radius:14px;padding:22px 20px;font-family:var(--f-book);font-size:16.5px;line-height:1.7;transition:background .2s,color .2s}
.paper.white{background:var(--paper-white);color:var(--ink)} .paper.old{background:var(--paper-old);color:#3a2f1c} .paper.black{background:#0e0e10;color:#e8e4dc;border:1px solid var(--border)}
.paper h2{font-size:20px;margin:0 0 10px}
.paper p{margin:0 0 12px}
.ref{border-bottom:2px solid var(--accent);font-weight:600;cursor:pointer}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1.3;padding:10px 14px;border-left:3px solid currentColor;opacity:.9}
.slash{background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:6px;font-family:var(--f-ui);font-size:13px;margin:-4px 0 12px;box-shadow:0 10px 24px rgb(0 0 0 / .4)}
.slash div{padding:8px 10px;border-radius:9px;display:flex;justify-content:space-between}
.slash div:first-child{background:var(--accent-soft)} .slash small{color:var(--muted)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;padding:0 4px}
.dot{color:var(--green)}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 4px;font-size:12px;cursor:pointer;font-family:var(--f-ui)}
.seg button.on{color:var(--accent);border-color:rgb(224 168 74 / .45)}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:9;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--raised);color:var(--muted)}
.tag.ai{background:rgb(196 165 253 / .15);color:var(--violet)}
.export{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:12px;line-height:1.5;color:var(--muted);white-space:pre-wrap;max-height:210px;overflow:auto;margin:14px 0 0;font-family:ui-monospace,Menlo,monospace}
.btn{border:0;border-radius:14px;padding:13px;font:600 14px var(--f-ui);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:var(--raised);color:var(--text)}
.soon{display:flex;flex-direction:column;gap:4px;border-style:dashed;cursor:default}
.phone.com{--accent:#b79cff;--accent-soft:rgb(183 156 255 / .14);--on-accent:#140d26}
.bar{transition:transform .25s ease}
.bar.hide{transform:translateY(130%)}
.bar .plus.here{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.post{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:12px}
.ph b{font-size:14px}
.av.sm{width:36px;height:36px;border-radius:12px;font-size:16px}
.art{aspect-ratio:4/5;max-width:100%;display:flex;align-items:flex-end;padding:22px;position:relative}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgb(255 255 255 / .12),transparent 55%)}
.quote{position:relative;z-index:1;font-family:var(--f-book);font-size:21px;line-height:1.4;color:#fff;text-wrap:balance;text-shadow:0 2px 12px rgb(0 0 0 / .4);outline:none}
.pa{display:flex;align-items:center;gap:4px;padding:8px 10px}
.lk{display:flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);padding:8px;border-radius:10px;font:500 13px var(--f-ui);cursor:pointer}
.lk.on{color:var(--accent)} .lk.on svg{fill:currentColor}
.rd{margin-left:auto;background:var(--accent-soft);color:var(--accent);border:0;border-radius:12px;padding:9px 14px;font:600 13px var(--f-ui);cursor:pointer}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cv{display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cv b{font-size:13.5px} .cv small{color:var(--muted);font-size:12px}
.flipbox{perspective:1400px}
.page{min-height:400px;transform-origin:left center}
.turn-f{animation:tf .46s ease} .turn-b{animation:tb .46s ease}
@keyframes tf{0%{transform:rotateY(0)}50%{transform:rotateY(-80deg);filter:brightness(.7)}100%{transform:rotateY(0)}}
@keyframes tb{0%{transform:rotateY(0)}50%{transform:rotateY(80deg);filter:brightness(.7)}100%{transform:rotateY(0)}}
.set{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;font-size:14px;border-top:1px solid var(--border)}
.srow:first-child{border-top:0}
.sv{color:var(--muted);font-size:13px;flex:none}
.tgl{display:inline-block;width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;vertical-align:middle}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .2s}
.tgl.on{background:var(--accent)} .tgl.on::after{transform:translateX(18px);background:var(--on-accent)}
.mini{display:flex;gap:4px} .mini b{font-weight:500;padding:4px 8px;border-radius:8px;background:var(--raised);font-size:12px} .mini b.on{color:var(--accent);background:var(--accent-soft)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.top .t{display:flex;min-width:0}.top .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding-right:4px}.top .t b{flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.jump{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.jump button{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font:500 13px var(--f-ui);cursor:pointer}
.jump button.on{color:var(--accent);border-color:rgb(224 168 74 / .45)}
.steps{display:flex;gap:6px;margin:2px 2px 16px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--border)} .steps i.on{background:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted)}
.inp{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font:15px var(--f-ui);min-height:20px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.big{font:600 20px var(--f-book)}
.inp.area{min-height:64px;line-height:1.5}
.inp:empty::before{content:attr(data-ph);color:var(--faint)}
.covers{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.covers .cover{width:62px;height:90px;cursor:pointer;border:2px solid transparent;font-size:10px}
.covers .cover.on{border-color:var(--accent)}
.covers .up{display:grid;place-items:center;background:var(--surface);border:1px dashed var(--border);color:var(--muted);box-shadow:none;font-family:var(--f-ui);text-align:center}
.opt{display:flex;gap:12px;align-items:flex-start}
.opt .rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);margin-top:2px}
.opt.on{border-color:rgb(224 168 74 / .5)} .opt.on .rad{border:6px solid var(--accent)}
.opt b{font-size:14.5px} .beats{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.5}
.bk{display:flex;gap:14px;align-items:flex-start}
.bk .cover{width:84px;height:122px;font-size:12px}
.bk h2{margin:2px 0 6px;font:600 22px/1.2 var(--f-book);text-wrap:balance}
.dots3{margin-left:auto;align-self:flex-start}
.bars{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--raised);margin:10px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.hint{display:flex;gap:10px;align-items:center}
.hint .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.hint .ic svg{width:17px;height:17px}
.hint span{flex:1;font-size:13.5px} .hint em{font-style:normal;color:var(--accent);font-size:13px}
.recent{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:10px 2px;border-top:1px solid var(--border)}
.recent:first-child{border-top:0} .recent small{color:var(--faint);flex:none}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);border-radius:10px;padding:8px 4px;font:500 13px var(--f-ui);cursor:pointer}
.tabs button.on{background:var(--raised);color:var(--text)}
.gf{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.gf .k{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.gf .k button{background:none;border:0;color:var(--accent);font:500 12px var(--f-ui);cursor:pointer;padding:2px}
.gf .v{font-size:14.5px;line-height:1.5;outline:none;min-height:21px}
.gf .v:empty::before{content:attr(data-ph);color:var(--faint)}
.gf.filled .k::after{content:"✓";color:var(--green);margin-left:auto;padding-left:8px}
.gf.filled .k{gap:0}
.beatlist{display:flex;flex-direction:column;gap:0}
.beat{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
.beat:first-child{border-top:0}
.beat .n{width:22px;height:22px;border-radius:7px;background:var(--raised);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.beat small{margin-left:auto;color:var(--faint);font-size:12px}
.qs{display:flex;flex-direction:column;gap:8px}
.qs div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13.5px;cursor:pointer}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--text);font:14.5px var(--f-ui);padding:13px 6px;border-top:1px solid var(--border);cursor:pointer;text-align:left}
.menu button:first-child{border-top:0} .menu button .ic{color:var(--muted)} .menu .danger{color:var(--red)} .menu .danger .ic{color:var(--red)}
.confirm{text-align:center;padding:4px 6px 0} .confirm h4{margin:4px 0 6px;font-size:17px} .confirm p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 14px}
.btn.danger{background:var(--red);color:#1b0606}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

[hidden]{display:none!important}
.sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
.ch{padding:12px}
.ch .top2{display:flex;gap:12px;align-items:center}
.ch .info{flex:1;min-width:0} .ch h4{margin:0 0 3px;font-size:15px}
.ch .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.ch .x svg{width:18px;height:18px}
.scenes{margin:10px 0 0 46px;display:flex;flex-direction:column;gap:6px}
.sc{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.sc small{margin-left:auto;color:var(--faint);font-size:11.5px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:30px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--raised);color:var(--text);cursor:pointer;font-size:12px}
.mv button:disabled{opacity:.3}
.reorder .ch{border-style:dashed}
.bar2{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar2 .row{flex:1;min-width:0}
.tbtn{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font:500 13px var(--f-ui);cursor:pointer}
.tbtn.on{color:var(--accent);border-color:rgb(224 168 74 / .45);background:var(--accent-soft)}
.dr .tags{margin-top:6px}
.link{font-size:12.5px;color:var(--accent)} .link.none{color:var(--faint)}
.peo{display:flex;flex-wrap:wrap;gap:6px}
.peo span{display:flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:4px 10px 4px 4px;font-size:12.5px}

 cli:{t:()=>`<span>Climas / </span><b>Neblina de maré baixa</b>`,back:'home',h:()=>`

 img:{t:()=>`<span>Imagens / </span><b>${IMG[selImg][0]}</b>`,back:'home',h:()=>`

};
const PLUS={per:[['user','Personagem'],['link','Relação'],['img','Imagem']],loc:[['pin','Local'],['img','Imagem']],cli:[['cloud','Clima'],['pin','Local']],img:[['img','Imagem'],['upload','Várias imagens']],rel:[['link','Relação'],['user','Personagem']]};
function render(){
  const s=S[cur];$('title').innerHTML=s.t();$('main').innerHTML=s.h();$('back').style.visibility=s.back?'visible':'hidden';
  $('bar').innerHTML=[['home','Painel'],['list','Capítulos'],null,['user','Fichas'],['bulb','Ideias']].map(b=>b?`<button class="${b[1]==='Fichas'?'on':''}" ${b[1]==='Fichas'?'data-go="home"':`data-toast="Abriria: ${b[1]}"`}>${ic(b[0])}${b[1]}</button>`:`<button class="plus" data-sheet="plus" aria-label="Criar">${ic('plus')}</button>`).join('');
  document.querySelectorAll('.sheet,.shade').forEach(e=>e.remove());
  if(sheet){const body=sheet==='plus'?`<h5>Criar em Fichas</h5><div class="acts">${(PLUS[tab]).map(p=>`<button class="act" data-toast="Criaria: ${p[1]}"><span class="ic">${ic(p[0])}</span>${p[1]}</button>`).join('')}<button class="act" data-toast="Criaria: Objeto ou evento"><span class="ic">${ic('compass')}</span>Objeto ou evento</button><div class="sep"></div><button class="act" data-toast="Abriria categorias"><span class="ic">${ic('star')}</span>Categorias</button></div>`
   :`<h5>Nova relação de Iracema</h5><div class="lbl" style="margin-top:4px">Com</div><div class="row">${P.slice(1).map((p,i)=>`<span class="chip${i===0?' on':''}" data-one>${p[1]}</span>`).join('')}</div><div class="lbl">Tipo</div><div class="row">${['Família','Amizade','Amor','Rivalidade','Inimizade','Trabalho','Aliança','Outra'].map((x,i)=>`<span class="chip${i===0?' on':''}" data-one>${x}</span>`).join('')}</div><div class="lbl">Descrição</div><div class="inp area" contenteditable="true" data-ph="Ex.: avó e neta; cria a menina desde os 4 anos"></div><button class="btn" style="width:100%;margin-top:12px" data-toast="Relação criada (aparece nas duas fichas)">Salvar</button>`;
   $('phone').insertAdjacentHTML('beforeend',`<div class="shade" data-close></div><div class="sheet" style="z-index:9;padding-bottom:24px"><div class="grab"></div>${body}</div>`)}
}
function go(k){cur=k;sheet=null;render();$('main').scrollTop=0}
function toast(t){const e=document.createElement('div');e.className='toast';e.style.zIndex=12;e.textContent=t;$('phone').appendChild(e);setTimeout(()=>e.remove(),1800)}
$('back').onclick=()=>S[cur].back&&go(S[cur].back);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-go],[data-sec],[data-img],[data-icat],[data-sheet],[data-close],[data-toast],[data-one]');if(!t)return;const d=t.dataset;
  if(d.one!==undefined){t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));return t.classList.add('on')}
  if(d.tab){tab=d.tab;return go('home')}
  if(d.go){return go(d.go)}
  if(d.sec){open[d.sec]=!open[d.sec];return render()}
  if(d.img){selImg=+d.img;return go('img')}
  if(d.icat){imgCat=d.icat;return render()}
  if(d.sheet){sheet=d.sheet;return render()}
  if(d.close!==undefined){sheet=null;return render()}
  if(d.toast){if(sheet){sheet=null;render()}return toast(d.toast)}
});
render();
</script>
